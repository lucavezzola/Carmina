<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Fase 3 - Il Nucleo Arcano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e1a;
    --ink: #cbd3e6;
    --ink-dim: #6b7396;
    --fulmine: #a3d5ff;
    --scudo: #4fd1c5;
    --fuoco: #ff6b35;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: system-ui, sans-serif; color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; display: block; }

  #hud {
    position: fixed; top: 24px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #titolo {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.4rem;
    letter-spacing: 0.06em; color: var(--ink);
    text-shadow: 0 0 18px rgba(163, 213, 255, 0.35);
  }
  #stato {
    font-size: 0.8rem; color: var(--ink-dim); margin-top: 4px;
    letter-spacing: 0.03em;
  }
  #btnConnetti {
    pointer-events: auto;
    background: transparent; color: var(--ink);
    border: 1px solid var(--ink-dim); border-radius: 999px;
    padding: 10px 20px; font-size: 0.85rem; letter-spacing: 0.04em;
    cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  #btnConnetti:hover { border-color: var(--ink); }
  #btnConnetti:disabled { opacity: 0.4; cursor: default; }

  #incantesimi {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 28px;
  }
  .incantesimo {
    font-family: 'Cinzel', serif; text-align: center; width: 92px;
  }
  .incantesimo .nome {
    font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .incantesimo .barra {
    margin-top: 8px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .incantesimo .barra .riempi {
    height: 100%; width: 100%; transform-origin: left; transition: transform 0.05s linear;
  }
  .fulmine .nome { color: var(--fulmine); }
  .fulmine .riempi { background: var(--fulmine); box-shadow: 0 0 8px var(--fulmine); }
  .scudo .nome { color: var(--scudo); }
  .scudo .riempi { background: var(--scudo); box-shadow: 0 0 8px var(--scudo); }
  .fuoco .nome { color: var(--fuoco); }
  .fuoco .riempi { background: var(--fuoco); box-shadow: 0 0 8px var(--fuoco); }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud">
  <div>
    <div id="titolo">Il Nucleo Arcano</div>
    <div id="stato">Non connesso</div>
  </div>
  <button id="btnConnetti">Connetti microfono</button>
</div>

<div id="incantesimi">
  <div class="incantesimo fulmine">
    <div class="nome">Fulmine</div>
    <div class="barra"><div class="riempi" data-spell="fulmine"></div></div>
  </div>
  <div class="incantesimo scudo">
    <div class="nome">Scudo</div>
    <div class="barra"><div class="riempi" data-spell="scudo"></div></div>
  </div>
  <div class="incantesimo fuoco">
    <div class="nome">Fuoco</div>
    <div class="barra"><div class="riempi" data-spell="fuoco"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// CONFIGURAZIONE
// ============================================================
const WS_URL = "ws://localhost:8765";
const COOLDOWN_MS = 1800; // durata cooldown per incantesimo, in millisecondi

const COLORI = {
  fulmine: 0xa3d5ff,
  scudo:   0x4fd1c5,
  fuoco:   0xff6b35,
};

// ============================================================
// SCENA THREE.JS
// ============================================================
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e1a, 0.045);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 6.5);
camera.lookAt(0, 0.6, 0);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pavimento: un disco scuro riflettente per dare profondità alla scena
const pavimento = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0x11152a, roughness: 0.6, metalness: 0.2 })
);
pavimento.rotation.x = -Math.PI / 2;
pavimento.position.y = -1.2;
scene.add(pavimento);

// Luci
scene.add(new THREE.AmbientLight(0x404060, 0.8));
const luceNucleo = new THREE.PointLight(0xffffff, 2, 8);
luceNucleo.position.set(0, 0.6, 0);
scene.add(luceNucleo);

// Il nucleo arcano: l'elemento "personaggio" che reagisce agli incantesimi
const nucleoGeom = new THREE.IcosahedronGeometry(0.7, 1);
const nucleoMat = new THREE.MeshStandardMaterial({
  color: 0x2a3050,
  emissive: 0x3a4a8a,
  emissiveIntensity: 0.6,
  roughness: 0.3,
  metalness: 0.4,
  flatShading: true,
});
const nucleo = new THREE.Mesh(nucleoGeom, nucleoMat);
nucleo.position.y = 0.6;
scene.add(nucleo);

// Guscio esterno sottile, sempre presente, per dare profondità al nucleo
const guscioGeom = new THREE.IcosahedronGeometry(0.78, 1);
const guscioMat = new THREE.MeshBasicMaterial({ color: 0x8a9cff, wireframe: true, transparent: true, opacity: 0.25 });
const guscio = new THREE.Mesh(guscioGeom, guscioMat);
guscio.position.copy(nucleo.position);
scene.add(guscio);

// ============================================================
// EFFETTI PER INCANTESIMO
// ============================================================

// Sistema di particelle generico e riutilizzabile per tutti gli effetti
function creaParticelle(colore, numero) {
  const geom = new THREE.BufferGeometry();
  const posizioni = new Float32Array(numero * 3);
  const velocita = [];
  for (let i = 0; i < numero; i++) {
    posizioni[i * 3 + 0] = 0;
    posizioni[i * 3 + 1] = 0.6;
    posizioni[i * 3 + 2] = 0;
    velocita.push(new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 2 + 0.5,
      (Math.random() - 0.5) * 2
    ));
  }
  geom.setAttribute("position", new THREE.BufferAttribute(posizioni, 3));
  const mat = new THREE.PointsMaterial({ color: colore, size: 0.06, transparent: true, opacity: 1 });
  const punti = new THREE.Points(geom, mat);
  scene.add(punti);
  return { punti, velocita, nato: performance.now(), vita: 900 };
}

let particelleAttive = [];

function effettoFulmine() {
  // Flash rapido di luce bianca + scarica visibile che colpisce il nucleo dall'alto
  luceNucleo.color.set(0xffffff);
  luceNucleo.intensity = 6;
  nucleoMat.emissive.set(COLORI.fulmine);
  nucleoMat.emissiveIntensity = 2.2;

  const puntiBolt = [];
  let x = 0, y = 4;
  while (y > nucleo.position.y) {
    puntiBolt.push(new THREE.Vector3(x, y, 0));
    x += (Math.random() - 0.5) * 0.5;
    y -= 0.4;
  }
  const boltGeom = new THREE.BufferGeometry().setFromPoints(puntiBolt);
  const boltMat = new THREE.LineBasicMaterial({ color: COLORI.fulmine, transparent: true, opacity: 1 });
  const bolt = new THREE.Line(boltGeom, boltMat);
  scene.add(bolt);
  setTimeout(() => scene.remove(bolt), 150);

  particelleAttive.push(creaParticelle(COLORI.fulmine, 40));
}

let scudoMesh = null;
function effettoScudo() {
  if (scudoMesh) scene.remove(scudoMesh);
  const geom = new THREE.SphereGeometry(1.1, 32, 32);
  const mat = new THREE.MeshBasicMaterial({
    color: COLORI.scudo, transparent: true, opacity: 0.22,
    side: THREE.DoubleSide,
  });
  scudoMesh = new THREE.Mesh(geom, mat);
  scudoMesh.position.copy(nucleo.position);
  scudoMesh.scale.setScalar(0.01);
  scene.add(scudoMesh);
  scudoMesh.userData.nato = performance.now();
}

function effettoFuoco() {
  nucleoMat.emissive.set(COLORI.fuoco);
  nucleoMat.emissiveIntensity = 1.6;
  particelleAttive.push(creaParticelle(COLORI.fuoco, 60));
}

const EFFETTI = { fulmine: effettoFulmine, scudo: effettoScudo, fuoco: effettoFuoco };

// ============================================================
// COOLDOWN E HUD
// ============================================================
const ultimoLancio = { fulmine: 0, scudo: 0, fuoco: 0 };
const barre = {};
document.querySelectorAll(".riempi").forEach(el => barre[el.dataset.spell] = el);

function pronto(nome) {
  return performance.now() - ultimoLancio[nome] >= COOLDOWN_MS;
}

function lanciaIncantesimo(nome) {
  if (!EFFETTI[nome] || !pronto(nome)) return;
  ultimoLancio[nome] = performance.now();
  EFFETTI[nome]();
}

function aggiornaBarreCooldown() {
  const ora = performance.now();
  for (const nome in barre) {
    const trascorso = ora - ultimoLancio[nome];
    const frazione = Math.min(trascorso / COOLDOWN_MS, 1);
    barre[nome].style.transform = `scaleX(${frazione})`;
  }
}

// ============================================================
// LOOP DI ANIMAZIONE
// ============================================================
function anima() {
  requestAnimationFrame(anima);
  const t = performance.now() * 0.001;

  // idle: rotazione lenta e pulsazione del nucleo
  nucleo.rotation.y = t * 0.3;
  nucleo.rotation.x = Math.sin(t * 0.4) * 0.1;
  guscio.rotation.y = -t * 0.15;

  // decadimento verso lo stato di riposo di luce ed emissione
  luceNucleo.intensity += (2 - luceNucleo.intensity) * 0.05;
  nucleoMat.emissiveIntensity += (0.6 - nucleoMat.emissiveIntensity) * 0.04;

  // aggiorna lo scudo, se presente: cresce e poi svanisce
  if (scudoMesh) {
    const eta = performance.now() - scudoMesh.userData.nato;
    const scala = Math.min(eta / 250, 1);
    scudoMesh.scale.setScalar(scala);
    scudoMesh.material.opacity = 0.22 * Math.max(0, 1 - Math.max(0, eta - 1800) / 600);
    if (eta > 2400) { scene.remove(scudoMesh); scudoMesh = null; }
  }

  // aggiorna le particelle attive: le muove e le rimuove a fine vita
  particelleAttive = particelleAttive.filter(p => {
    const eta = performance.now() - p.nato;
    if (eta > p.vita) { scene.remove(p.punti); return false; }
    const pos = p.punti.geometry.attributes.position;
    for (let i = 0; i < p.velocita.length; i++) {
      pos.array[i * 3 + 0] += p.velocita[i].x * 0.016;
      pos.array[i * 3 + 1] += p.velocita[i].y * 0.016;
      pos.array[i * 3 + 2] += p.velocita[i].z * 0.016;
      p.velocita[i].y -= 0.03; // gravità leggera
    }
    pos.needsUpdate = true;
    p.punti.material.opacity = 1 - eta / p.vita;
    return true;
  });

  aggiornaBarreCooldown();
  renderer.render(scene, camera);
}
anima();

// ============================================================
// CONNESSIONE AUDIO (identica alla Fase 2, con trigger degli effetti)
// ============================================================
const btn = document.getElementById("btnConnetti");
const stato = document.getElementById("stato");
let ws, audioContext, workletNode, micStream;

btn.addEventListener("click", async () => {
  if (ws) return;
  btn.disabled = true;
  stato.textContent = "Connessione al server...";
  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = async () => {
    stato.textContent = "Connesso. Richiedo il microfono...";
    await avviaMicrofono();
    stato.textContent = "In ascolto. Pronuncia un incantesimo.";
  };

  ws.onmessage = (event) => {
    const dati = JSON.parse(event.data);
    lanciaIncantesimo(dati.word);
  };

  ws.onclose = () => { stato.textContent = "Disconnesso."; ws = null; btn.disabled = false; };
  ws.onerror = (e) => { console.error(e); stato.textContent = "Errore di connessione."; btn.disabled = false; };
});

async function avviaMicrofono() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioContext = new AudioContext();
  await audioContext.audioWorklet.addModule("pcm-processor.js");
  const source = audioContext.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioContext, "pcm-processor", {
    processorOptions: { targetSampleRate: 16000, inputSampleRate: audioContext.sampleRate }
  });
  workletNode.port.onmessage = (event) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(event.data);
  };
  source.connect(workletNode);
}
</script>
</body>
</html>
