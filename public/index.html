<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Prototipo: Mappa in Prima Persona</title>
<style>
  html, body { margin: 0; height: 100%; background: #87ceeb; overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; display: block; }
  #istruzioni {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: #fff; font-family: system-ui, sans-serif;
    text-align: center; cursor: pointer; z-index: 10;
  }
  #istruzioni h2 { margin-bottom: 8px; }
  #istruzioni p { color: #ccc; font-size: 0.9rem; }
  #mirino {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.6); pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="mirino"></div>
<div id="istruzioni">
  <div>
    <h2>Clicca per entrare</h2>
    <p>WASD per muoverti, mouse per guardarti intorno, ESC per uscire</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script>
// ============================================================
// SCENA BASE
// ============================================================
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 15, 55);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 5); // 1.7 = altezza occhi approssimativa di una persona

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.1));
const sole = new THREE.DirectionalLight(0xfff4e0, 1.2);
sole.position.set(10, 20, 8);
scene.add(sole);

// Terreno
const terreno = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x3d6b3d })
);
terreno.rotation.x = -Math.PI / 2;
scene.add(terreno);

// ============================================================
// OSTACOLI: lista di { x, z, raggio } usata sia per posizionare
// gli oggetti sia per le collisioni (li trattiamo come cilindri
// visti dall'alto, ignorando l'altezza).
// ============================================================
const ostacoli = [];

function creaAlbero(x, z) {
  const gruppo = new THREE.Group();

  const tronco = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 1.4, 8),
    new THREE.MeshStandardMaterial({ color: 0x5a3d2b })
  );
  tronco.position.y = 0.7;
  gruppo.add(tronco);

  const chioma = new THREE.Mesh(
    new THREE.ConeGeometry(1.1, 2.2, 8),
    new THREE.MeshStandardMaterial({ color: 0x2e5c2e })
  );
  chioma.position.y = 2.2;
  gruppo.add(chioma);

  gruppo.position.set(x, 0, z);
  scene.add(gruppo);
  ostacoli.push({ x, z, raggio: 0.6 }); // raggio di collisione, un po' più stretto della chioma
}

function creaEdificio(x, z, largo, alto, profondo, colore) {
  const edificio = new THREE.Mesh(
    new THREE.BoxGeometry(largo, alto, profondo),
    new THREE.MeshStandardMaterial({ color: colore })
  );
  edificio.position.set(x, alto / 2, z);
  scene.add(edificio);
  // approssimiamo il rettangolo con un cerchio di collisione: raggio = metà diagonale
  const raggio = Math.sqrt(largo * largo + profondo * profondo) / 2;
  ostacoli.push({ x, z, raggio });
}

// Il modello del mago: sfera (corpo) + cono (cappello). Riutilizzabile per
// ogni giocatore che vedremo quando colleghiamo il multiplayer — il TUO
// mago in prima persona non si vede mai (la camera È la sua testa), ma gli
// altri giocatori li vedrai così.
function creaMago(x, z, coloreVeste) {
  const gruppo = new THREE.Group();

  const corpo = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 16, 16),
    new THREE.MeshStandardMaterial({ color: coloreVeste })
  );
  corpo.position.y = 0.9;
  gruppo.add(corpo);

  const cappello = new THREE.Mesh(
    new THREE.ConeGeometry(0.35, 0.7, 16),
    new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
  );
  cappello.position.y = 1.55;
  gruppo.add(cappello);

  gruppo.position.set(x, 0, z);
  scene.add(gruppo);
  ostacoli.push({ x, z, raggio: 0.5 });
  return gruppo;
}

// Popoliamo la mappa
for (let i = 0; i < 14; i++) {
  const angolo = Math.random() * Math.PI * 2;
  const distanza = 6 + Math.random() * 25;
  creaAlbero(Math.cos(angolo) * distanza, Math.sin(angolo) * distanza);
}
creaEdificio(-8, -6, 4, 3.5, 4, 0x8a7a6a);
creaEdificio(9, -4, 5, 4.5, 3, 0x9a8a7a);
creaEdificio(0, -14, 6, 5, 5, 0x7a6a5a);
creaMago(4, 3, 0x6b3fa0);
creaMago(-5, 6, 0x2f6fa0);

// ============================================================
// CONTROLLI IN PRIMA PERSONA
// ============================================================
const controls = new THREE.PointerLockControls(camera, document.body);
const istruzioni = document.getElementById("istruzioni");
const mirino = document.getElementById("mirino");

istruzioni.addEventListener("click", () => controls.lock());
controls.addEventListener("lock", () => { istruzioni.style.display = "none"; mirino.style.display = "block"; });
controls.addEventListener("unlock", () => { istruzioni.style.display = "flex"; mirino.style.display = "none"; });

const tasti = { avanti: false, indietro: false, sinistra: false, destra: false };
document.addEventListener("keydown", (e) => impostaTasto(e.code, true));
document.addEventListener("keyup", (e) => impostaTasto(e.code, false));

function impostaTasto(codice, valore) {
  if (codice === "KeyW") tasti.avanti = valore;
  if (codice === "KeyS") tasti.indietro = valore;
  if (codice === "KeyA") tasti.sinistra = valore;
  if (codice === "KeyD") tasti.destra = valore;
}

const VELOCITA = 4.0; // metri al secondo
const RAGGIO_GIOCATORE = 0.35;

function aggiornaMovimento(delta) {
  if (!controls.isLocked) return;

  // direzione desiderata in spazio LOCALE (rispetto a dove guardi):
  // z negativo = avanti, x positivo = destra. PointerLockControls la
  // converte automaticamente in spazio mondo tenendo conto della rotazione.
  let dx = 0, dz = 0;
  if (tasti.avanti) dz -= 1;
  if (tasti.indietro) dz += 1;
  if (tasti.sinistra) dx -= 1;
  if (tasti.destra) dx += 1;

  if (dx !== 0 || dz !== 0) {
    const lunghezza = Math.hypot(dx, dz);
    dx /= lunghezza; dz /= lunghezza; // normalizza: diagonale non più veloce

    const spostamento = VELOCITA * delta;
    const posizionePrima = camera.position.clone();

    controls.moveRight(dx * spostamento);
    controls.moveForward(-dz * spostamento);

    risolviCollisioni(posizionePrima);
  }
}

function risolviCollisioni(posizionePrima) {
  for (const o of ostacoli) {
    const dx = camera.position.x - o.x;
    const dz = camera.position.z - o.z;
    const distanza = Math.hypot(dx, dz);
    const minima = o.raggio + RAGGIO_GIOCATORE;
    if (distanza < minima && distanza > 0.0001) {
      // spingi il giocatore fuori dall'ostacolo, lungo la direzione che lo allontana
      const fattore = minima / distanza;
      camera.position.x = o.x + dx * fattore;
      camera.position.z = o.z + dz * fattore;
    }
  }
  // non farti mai scendere sotto l'altezza occhi (niente salti/gravità per ora)
  camera.position.y = 1.7;
}

// ============================================================
// LOOP
// ============================================================
let ultimoTempo = performance.now();
function anima() {
  requestAnimationFrame(anima);
  const ora = performance.now();
  const delta = Math.min((ora - ultimoTempo) / 1000, 0.1); // clamp: evita salti se la tab perde il focus
  ultimoTempo = ora;

  aggiornaMovimento(delta);
  renderer.render(scene, camera);
}
anima();
</script>
</body>
</html>
