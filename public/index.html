<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Fase 5 - Mappa Multiplayer in Prima Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #87ceeb; overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; display: block; }
  body { font-family: system-ui, sans-serif; color: #cbd3e6; }

  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: #fff; text-align: center; cursor: pointer; z-index: 10;
  }
  #overlay h2 { font-family: 'Cinzel', serif; margin-bottom: 8px; }
  #overlay p { color: #ccc; font-size: 0.9rem; }

  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 4px rgba(0,0,0,0.6); pointer-events: none; display: none;
  }

  #hud {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 5px;
    border-radius: 5px;
    font-size: 0.8rem;
    color: #c1ccf0;
    background-color: rgba(0, 16, 96, 0.7);
  }

  #debug-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    min-width: 190px;
    padding: 10px 12px;
    border: 1px solid rgba(199, 125, 255, 0.45);
    border-radius: 6px;
    background: rgba(8, 6, 24, 0.82);
    color: #e6d9ff;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre;
    pointer-events: none;
    display: none;
    z-index: 6;
  }


  #healthbar-container {
    position: fixed; top: 50%; left: 24px; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 5;
    border-radius: 10px;
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.8);
  }
  #healthbar-track {
    width: 16px; height: 220px; border-radius: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  }
  #healthbar-fill {
    width: 100%; height: 100%; background: #4caf50;
    transition: height 0.25s ease, background 0.25s ease;
  }
  #healthbar-label {
    font-family: 'Cinzel', serif; font-size: 0.72rem; color: #cbd3e6; letter-spacing: 0.05em;
  }
  #damage-vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.75) 100%);
    opacity: 0;
    transition: opacity 0.15s ease-out;
  }
  #spells {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 28px;
    border-radius: 10px;
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.8);
  }
  .spell { font-family: 'Cinzel', serif; text-align: center; width: 92px; }
  .spell .name { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .spell .bar { margin-top: 8px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .spell .fill { height: 100%; width: 100%; transform-origin: left; transition: transform 0.05s linear; }
  .spell .countdown { min-height: 0.9em; margin-top: 4px; color: rgba(255,255,255,0.68); font: 0.66rem/1 system-ui, sans-serif; }
  .spell.cooling .name,
  .spell.cooling .fill { filter: brightness(0.42); opacity: 0.58; }
  .fulmine .name { color: #a3d5ff; } .fulmine .fill { background: #a3d5ff; box-shadow: 0 0 8px #a3d5ff; }
  .scudo .name { color: #4fd1c5; } .scudo .fill { background: #4fd1c5; box-shadow: 0 0 8px #4fd1c5; }
  .fuoco .name { color: #ff6b35; } .fuoco .fill { background: #ff6b35; box-shadow: 0 0 8px #ff6b35; }
  .porta .name { color: #c77dff; transition: text-shadow 0.2s ease, color 0.2s ease; }
  .porta.armed .name { color: #f2c2ff; text-shadow: 0 0 6px #c77dff, 0 0 16px #9b5de5; }
  .porta .fill { background: #9b5de5; box-shadow: 0 0 8px #9b5de5; }
  .porta .countdown { min-height: 0.9em; margin-top: 4px; color: #d9b3ff; font-size: 0.66rem; }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="crosshair"></div>
<div id="hud">Non connesso</div>
<div id="debug-panel" aria-hidden="true"></div>
<div id="healthbar-container">
  <div id="healthbar-track"><div id="healthbar-fill"></div></div>
  <div id="healthbar-label">100</div>
</div>
<div id="damage-vignette"></div>
<div id="overlay">
  <div>
    <h2>Clicca per entrare</h2>
    <p>WASD per muoverti, mouse per guardarti intorno, M per mutarti, ESC per uscire<br>Pronuncia un incantesimo per lanciarlo!</p>
  </div>
</div>

<div id="spells">
  <div class="spell fulmine"><div class="name">Fulmine</div><div class="bar"><div class="fill" data-spell="fulmine"></div></div><div class="countdown" data-spell-status="fulmine"></div></div>
  <div class="spell scudo"><div class="name">Scudo</div><div class="bar"><div class="fill" data-spell="scudo"></div></div><div class="countdown" data-spell-status="scudo"></div></div>
  <div class="spell fuoco"><div class="name">Fuoco</div><div class="bar"><div class="fill" data-spell="fuoco"></div></div><div class="countdown" data-spell-status="fuoco"></div></div>
  <div class="spell porta"><div class="name">Porta</div><div class="bar"><div class="fill" data-spell="porta"></div></div><div class="countdown" data-spell-status="porta"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script type="module" src="./js/app.mjs"></script>
</body>
</html>
